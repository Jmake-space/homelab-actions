name: triaged-agent-alerts

on:
  repository_dispatch:
    types:
      - triaged-agent-alert
  workflow_dispatch:
    inputs:
      payload_json:
        description: "Optional JSON payload for test runs"
        required: false
        default: "{}"
      dry_run:
        description: "Preview formatting without sending email"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  notify:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Build and send triaged alert email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          PAYLOAD_INPUT: ${{ github.event.inputs.payload_json }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ALERT_STAGE: triaged
          TRIAGED_NODE_EMAIL_ENABLED: ${{ vars.TRIAGED_NODE_EMAIL_ENABLED || 'false' }}
        run: |
          python3 scripts/alert_email.py

  support-incident-log:
    runs-on: [self-hosted]
    needs: notify
    if: ${{ github.event.client_payload.target_agent == 'k3s-support-agent' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: Ensure git is available
        run: |
          if command -v git >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v4

      - name: Write support incident file
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          EASTERN_TZ = ZoneInfo("America/New_York")

          def eastern_timestamp(value):
              if not value:
                  return ""
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return value
              return parsed.astimezone(EASTERN_TZ).strftime("%Y-%m-%d %H:%M:%S %Z")

          payload = json.loads(os.environ.get("PAYLOAD") or "{}")
          ts = datetime.now(timezone.utc)
          stamp = ts.strftime("%Y%m%d-%H%M%S")
          y = ts.strftime("%Y")
          m = ts.strftime("%m")

          routing = payload.get("routing", {})
          runbook_ref = routing.get("runbook_ref", "")
          mitigation_plan = routing.get("mitigation_plan", "")

          out_dir = Path("incidents") / "k3s-support-agent" / y / m
          out_dir.mkdir(parents=True, exist_ok=True)
          out_file = out_dir / f"incident-{stamp}-run-{os.environ.get('RUN_ID','')}.md"

          lines = [
              f"# k3s-support-agent Incident {stamp}",
              "",
              f"- cluster: {payload.get('cluster','')}",
              f"- event: {payload.get('event','')}",
              f"- status: {payload.get('status','')}",
              f"- resource_type: {payload.get('resource_type','')}",
              f"- target_agent: {payload.get('target_agent','')}",
              f"- routed_service: {routing.get('service','')}",
              f"- route_reason: {payload.get('route_reason','')}",
              f"- timestamp_eastern: {payload.get('timestamp_eastern') or eastern_timestamp(payload.get('timestamp',''))}",
              f"- timestamp: {payload.get('timestamp','')}",
              "",
              "## Summary",
              payload.get("summary", ""),
              "",
              "## Runbook Reference",
              runbook_ref or "(not provided)",
              "",
              "## Mitigation Plan",
              mitigation_plan or "(not provided)",
              "",
              "## Raw Payload",
              "```json",
              json.dumps(payload, indent=2, sort_keys=True),
              "```",
          ]
          out_file.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"wrote {out_file}")
          PY

      - name: Commit support incident log
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain incidents/k3s-support-agent)" ]; then
            echo "No incident file changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add incidents/k3s-support-agent
          git commit -m "chore(incidents): log k3s-support triaged incident"
          git push
